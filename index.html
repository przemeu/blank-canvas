<!doctype html>
<html lang="pl" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logos/arka_gdynia.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Kalendarium Arki Gdynia – kronika wszystkich meczów od 1953 roku: wyniki, składy, strzelcy, frekwencja i statystyki." />
    <meta name="theme-color" content="#003c74" />
    <title>Kalendarium Arki Gdynia</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t === "light") {
            document.documentElement.classList.remove("dark");
          } else {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
